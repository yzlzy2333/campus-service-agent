name: Linux deployment

on:
  push:
    branches: [deploy/linux]

permissions:
  contents: read

jobs:
  offline-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install and check dependencies
        run: |
          ./deploy.sh setup
          .venv/bin/python -m pip check
      - name: Verify offline deployment
        run: |
          ./deploy.sh run --rebuild-index
          printf '/exit\n' | ./deploy.sh run --offline
          .venv/bin/python -X utf8 -m evaluation.audit
