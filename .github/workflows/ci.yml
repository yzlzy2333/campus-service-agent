name: Deployment and regression checks

on:
  push:
    branches: [verify/apple-silicon]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify deployment
        run: |
          python -X utf8 -m campus --rebuild-index
          printf '/exit\n' | python -X utf8 -m campus --offline
      - name: Check deployment launcher
        if: github.ref_name == 'deploy/linux' || github.ref_name == 'deploy/macos'
        run: |
          sh -n deploy.sh
          ./deploy.sh setup
          ./deploy.sh run --rebuild-index
          printf '/exit\n' | ./deploy.sh run --offline
      - name: Run reliability and frozen regressions
        run: |
          python -X utf8 -m unittest evaluation.test_reliability -v
          python -X utf8 -m evaluation.audit
          python -X utf8 -m evaluation.run --out evaluation/ci-results.json
          python -c 'import json; r=json.load(open("evaluation/ci-results.json", encoding="utf-8"))["summary"]; assert all(g["all"]["passed"] == g["all"]["total"] for g in r["offline"].values()); assert r["fixture_http"]["passed"] == r["fixture_http"]["total"]; assert r["retrieval"]["hits"] == r["retrieval"]["total"]'
